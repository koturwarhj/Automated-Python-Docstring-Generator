[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "docstring-enforcer"
version = "0.1.0"
description = "Automated docstring enforcement tool"
authors = [{name = "Your Name", email = "your.email@example.com"}]
dependencies = ["astor", "click"]

[project.scripts]
docstring-enforcer = "docstring_enforcer.cli:main"
